name: Deploy frontend to Azure Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_AZURE_MAPS_KEY: ${{ secrets.VITE_AZURE_MAPS_KEY }}
          VITE_AZURE_MAPS_CLIENT_ID: ${{ secrets.VITE_AZURE_MAPS_CLIENT_ID }}
          VITE_APP_TITLE: Caribbean Climate Resilience Orchestrator
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve frontend storage key
        run: |
          ACCOUNT_KEY="$(az storage account keys list \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --query "[0].value" -o tsv)"
          echo "::add-mask::$ACCOUNT_KEY"
          echo "AZURE_STORAGE_ACCOUNT_KEY=$ACCOUNT_KEY" >> "$GITHUB_ENV"

      - name: Enable static website
        run: |
          az storage blob service-properties update \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --account-key "$AZURE_STORAGE_ACCOUNT_KEY" \
            --static-website \
            --index-document index.html \
            --404-document 404.html

      - name: Upload frontend directly to $web
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --account-key "$AZURE_STORAGE_ACCOUNT_KEY" \
            --auth-mode key \
            --destination '$web' \
            --source dist \
            --overwrite
