name: Deploy backend to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure backend app settings
        run: |
          az webapp config appsettings set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_BACKEND_WEBAPP_NAME }}" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              ENABLE_ORYX_BUILD=true \
              PYTHONPATH=/home/site/wwwroot \
              APP_ENV=production \
              APP_NAME="Caribbean Climate Resilience Orchestrator API" \
              API_PREFIX=/api/v1 \
              DEFAULT_COUNTRY=JM \
              DEFAULT_HORIZON=2050 \
              CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
              ENABLE_AZURE_OPENAI="${{ secrets.ENABLE_AZURE_OPENAI }}" \
              AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
              AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
              AZURE_OPENAI_DEPLOYMENT="${{ secrets.AZURE_OPENAI_DEPLOYMENT }}" \
              AZURE_OPENAI_API_VERSION="${{ secrets.AZURE_OPENAI_API_VERSION }}" \
              FOUNDRY_PROJECT_ENDPOINT="${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}" \
              FOUNDRY_API_KEY="${{ secrets.FOUNDRY_API_KEY }}" \
              FOUNDRY_AGENT_ID="${{ secrets.FOUNDRY_AGENT_ID }}" \
              FOUNDRY_KNOWLEDGE_BASE_NAME="${{ secrets.FOUNDRY_KNOWLEDGE_BASE_NAME }}" \
              AZURE_SEARCH_ENDPOINT="${{ secrets.AZURE_SEARCH_ENDPOINT }}" \
              AZURE_SEARCH_ADMIN_KEY="${{ secrets.AZURE_SEARCH_ADMIN_KEY }}" \
              AZURE_SEARCH_INDEX_NAME="${{ secrets.AZURE_SEARCH_INDEX_NAME }}" \
              FABRIC_SEMANTIC_MODEL_ID="${{ secrets.FABRIC_SEMANTIC_MODEL_ID }}" \
              POWERBI_TENANT_ID="${{ secrets.POWERBI_TENANT_ID }}" \
              POWERBI_CLIENT_ID="${{ secrets.POWERBI_CLIENT_ID }}" \
              POWERBI_CLIENT_SECRET="${{ secrets.POWERBI_CLIENT_SECRET }}" \
              POWERBI_WORKSPACE_ID="${{ secrets.POWERBI_WORKSPACE_ID }}" \
              POWERBI_REPORT_ID="${{ secrets.POWERBI_REPORT_ID }}" \
              AZURE_MAPS_CLIENT_ID="${{ secrets.AZURE_MAPS_CLIENT_ID }}" \
              AZURE_MAPS_KEY="${{ secrets.AZURE_MAPS_KEY }}" \
              KEY_VAULT_URI="${{ secrets.KEY_VAULT_URI }}"

      - name: Set backend startup command
        run: |
          az webapp config set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_BACKEND_WEBAPP_NAME }}" \
            --startup-file "bash startup.sh"

      - name: Package backend for direct deploy
        run: |
          mkdir -p deploy
          cp -r backend deploy/backend
          cp requirements.txt deploy/requirements.txt
          cp startup.sh deploy/startup.sh
          cd deploy
          zip -r ../backend-release.zip .

      - name: Deploy backend directly to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_WEBAPP_NAME }}
          package: backend-release.zip
